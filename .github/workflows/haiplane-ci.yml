# Laid down by Haiplane Hub provisioning (#476) — do not rename this file.
#
# The hub owns the name `haiplane-ci.yml` and nothing else in this
# directory. It is written only
# into a repository that carried NO workflows of its own, so this file never
# replaced an opinion somebody else had already expressed about CI here.
#
# What it is for: the delivery gate merges a pull request only after reading a
# workflow's outcome. With no workflow at all the probe answers "absent" and
# approved, green work cannot be delivered by any supported path.
name: Haiplane CI

on:
  # No base-branch allowlist, deliberately (#475/#476). The gate reads THIS
  # workflow's outcome, so a base the list did not name produces no run, and
  # the branch a project integrates on is a project setting the hub resolves
  # from project.default_branch — not a list somebody must remember to edit
  # here when the repository renames its integration branch.
  pull_request:
  # Push IS named explicitly, and the list is rendered per project rather than
  # written here: it is what produces evidence for a pair task, which lands
  # work without ever opening a pull request. The CI report is keyed by
  # COMMIT, so a push of the task branch is enough.
  push:
    branches: ["main", "task-*/**"]
  # Manual run: the only way besides a push to main to start the macOS leg.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Checks
    # make check on both validation targets (sdd-spec NFR-003), but the macOS
    # leg only on a push to main or a manual run (owner decision 24.09, #1377):
    # a macOS minute in a private repository costs ten Linux minutes. Every
    # push and pull request still gets the ubuntu leg, which reports to the hub.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The hub pins a commit at submission (#572) and compares it against
          # the branch head before merging; a depth-1 checkout cannot answer
          # that comparison.
          fetch-depth: 0

      # This repository's own build and test steps (task #1376).
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.3"
          python-version: "3.12"

      - name: Install locked dependencies
        id: install
        run: uv sync --locked

      # make check split into its four targets, one step each, so the hub
      # report can name every check and its outcome (#1377 AC-6). The later
      # steps run even when an earlier one fails (the result is still red):
      # a lint error must not hide what the tests say.
      - name: Lint (ruff check)
        id: lint
        run: make lint

      - name: Format (ruff format --check)
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make format-check

      - name: Types (mypy --strict)
        id: types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make typecheck

      - name: Tests (pytest)
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test

      - name: Security tests
        id: security
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest -q tests/security/

      # ---------------------------------------------------------------------
      # (Hub provisioning note, kept for context.)
      # ADD THIS REPOSITORY'S OWN BUILD AND TEST STEPS HERE.
      #
      # The hub deliberately does not guess them. Inventing a build command
      # for a repository it has never read would turn "no CI" into "failing
      # CI", which is strictly worse: the delivery gate treats a red job as a
      # blocker and spends fix cycles on it, while an honest silence is read
      # as unknown and routed to a human.
      # ---------------------------------------------------------------------

      # Carries the result of this repository's acceptance tests back to the
      # hub as evidence about ONE commit. Never fails the job and never
      # reports a guess — see docs/satellite-ci-report.md.
      #
      # always() + continue-on-error: the gate reads this job's outcome, so a
      # hiccup in the reporter must never block delivery for every task.
      #
      # head-sha is passed explicitly: on pull_request events GITHUB_SHA is a
      # throwaway merge commit that exists in no branch and can never equal
      # the tip the hub pinned at submission.
      #
      # Referenced by version rather than copied: a copy of the reporter in
      # this repository would drift from the original silently.
      # Reported once per commit, from the ubuntu leg only: both legs run the
      # same AC tests, and two reports for one commit would race each other.
      - name: Report AC tests and validation to Hub
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        continue-on-error: true
        uses: agentdrover/haiplane/.github/actions/hub-ci-report@main
        with:
          hub-url: ${{ secrets.HAIPLANE_HUB_URL }}
          hub-token: ${{ secrets.HAIPLANE_HUB_CI_TOKEN }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ac-runner: "uv run pytest"
          # Step outcomes by name, so the reviewer does not re-judge what a
          # linter already proved (hub-ci-report input `checks`).
          checks: >-
            lint=${{ steps.lint.outcome }},
            format=${{ steps.format.outcome }},
            types=${{ steps.types.outcome }},
            tests=${{ steps.tests.outcome }}
          # The task's validation commands this job already ran, spelled
          # exactly as the task names them. `make check` passed only if all
          # four of its targets did.
          ran-commands: |
            ${{ (steps.lint.outcome == 'success' && steps.format.outcome == 'success' && steps.types.outcome == 'success' && steps.tests.outcome == 'success') && 'success' || 'failure' }} make check
            ${{ steps.security.outcome }} uv run pytest -q tests/security/
