[project]
name = "ssh-id-doctor"
version = "0.1.0"
description = "Read-only local CLI: SSH identity inventory, relationship map, evidence-backed findings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ssh-id-doctor = "ssh_id_doctor.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssh_id_doctor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.13.1",
]
